kind = "web"
previewPath = "/"
title = "ALLSTARS COLLECTIBLES"
version = "1.0.0"
id = "artifacts/gacha"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24287

[services.development]
run = "pnpm --filter @workspace/gacha run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gacha", "run", "build" ]
publicDir = "artifacts/gacha/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24287"
BASE_PATH = "/"
